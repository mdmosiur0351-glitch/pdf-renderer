      - name: Download PDF
        env:
          PDF_URL: ${{ github.event.client_payload.pdf_url }}
        run: |
          rm -f input.pdf

          for i in {1..10}; do
            echo "Download attempt $i..."

            curl -k -L --fail \
              --connect-timeout 30 \
              --max-time 300 \
              --retry 3 \
              --retry-delay 5 \
              -C - \
              "$PDF_URL" \
              -o input.pdf && break

            echo "Download failed. Retrying in 5 seconds..."
            sleep 5
          done

          if [ ! -f input.pdf ]; then
            echo "PDF download failed."
            exit 1
          fi

          echo "Downloaded file:"
          file input.pdf
          ls -lh input.pdf

          echo "Checking PDF header..."
          head -c 5 input.pdf | od -An -t x1

          if ! head -c 5 input.pdf | grep -q "%PDF-"; then
            echo "ERROR: Downloaded file is not a valid PDF."
            exit 1
          fi

          echo "Valid PDF detected."
