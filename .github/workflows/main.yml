name: PDF to Image Only PDF

on:
  repository_dispatch:
    types: [process-pdf]

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      - name: Download PDF
        env:
          PDF_URL: ${{ github.event.client_payload.pdf_url }}
        run: |
          curl -k -L --fail --retry 5 --retry-delay 5 \
            --connect-timeout 30 --max-time 600 \
            "$PDF_URL" -o input.pdf

          file input.pdf
          ls -lh input.pdf

      - name: Install PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Convert PDF pages to JPG
        run: |
          mkdir -p pages
          pdftoppm -jpeg -r 200 input.pdf pages/page
          ls -lh pages/

      - name: Create image-only PDF
        run: |
          python -m pip install Pillow

          python <<'PY'
          from PIL import Image
          import glob

          files = sorted(glob.glob("pages/*.jpg"))

          if not files:
              raise Exception("No JPG pages were created.")

          images = [Image.open(f).convert("RGB") for f in files]

          images[0].save(
              "output-image-only.pdf",
              save_all=True,
              append_images=images[1:]
          )

          print("Created:", len(images), "pages")
          PY

      - name: Upload output PDF
        uses: actions/upload-artifact@v4
        with:
          name: image-only-pdf
          path: output-image-only.pdf
